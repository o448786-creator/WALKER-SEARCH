<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c10">
<title>WALKER // SEARCH</title>
<link rel="icon" href="logo.jpeg">
<link rel="manifest" href="manifest.json">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Courier New", monospace;
}

body {
    min-height: 100vh;
    background: #0b0c10;
    color: #c5c6c7;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

#data-stream-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: .15;
    pointer-events: none;
}

.bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        rgba(11,12,16,.8),
        rgba(11,12,16,.3),
        rgba(11,12,16,.8)
    );
    z-index: 1;
    pointer-events: none;
}

.search-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 650px;
    margin-top: 15vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    width: 180px;
    height: 180px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #66fcf1;
    background: rgba(11, 12, 16, 0.9);

    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;

    box-shadow:
        0 0 10px #00f2fe,
        0 0 25px rgba(0, 242, 254, 0.5);

    text-shadow: 0 0 10px #00f2fe;
}

.subtitle {
    font-size: 11px;
    letter-spacing: 5px;
    color: #66fcf1;
    margin: 12px 0 40px;
    text-align: center;
}

.search-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.search-box {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 20px;
    border: 1px solid #1f2833;
    background: rgba(11,12,16,.9);
    transition: .3s;
}

.search-box::before {
    content: "//";
    color: #66fcf1;
    font-weight: bold;
    margin-right: 12px;
}

.search-box:focus-within {
    border-color: #66fcf1;
    box-shadow: 0 0 15px #00f2fe40;
}

.search-box input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 15px;
}

.search-box input::placeholder {
    color: #45a29e;
    opacity: .8;
}

.buttons {
    margin-top: 25px;
}

.btn {
    background: #0b0c10;
    border: 1px solid #45a29e;
    color: #66fcf1;
    padding: 12px 24px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .2s;
}

.btn:hover {
    background: #66fcf1;
    color: #0b0c10;
    box-shadow: 0 0 15px #00f2fe66;
}

.btn:disabled {
    opacity: .6;
    cursor: wait;
}

.results-container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 750px;
    padding: 0 20px 60px;
    margin-top: 40px;
}

.status {
    color: #66fcf1;
    margin-bottom: 20px;
    overflow-wrap: anywhere;
}

.result-item {
    padding: 20px;
    margin-bottom: 20px;
    background: rgba(11,12,16,.94);
    border: 1px solid #1f2833;
    border-left: 3px solid #45a29e;
    transition: .2s;
    overflow-wrap: anywhere;
}

.result-item:hover {
    border-color: #66fcf1;
    transform: translateX(2px);
}

.result-item.custom-site {
    border-left-color: #66fcf1;
    background: rgba(0,242,254,.04);
}

.result-item a {
    text-decoration: none;
}

.display-link {
    display: block;
    color: #45a29e;
    font-size: 12px;
    margin-bottom: 8px;
}

.result-item h3 {
    color: white;
    font-size: 18px;
    margin-bottom: 8px;
}

.result-item h3:hover {
    color: #66fcf1;
}

.snippet {
    font-size: 13px;
    line-height: 1.6;
}

.custom-label {
    color: #66fcf1;
    font-size: 10px;
    margin-top: 10px;
}

.fallback {
    margin-top: 20px;
    font-size: 12px;
    color: #45a29e;
}

.fallback a {
    color: #66fcf1;
}

@media (max-width: 600px) {
    .search-container {
        margin-top: 12vh;
    }

    .logo {
        font-size: 32px;
        letter-spacing: 3px;
    }

    .subtitle {
        letter-spacing: 3px;
    }

    .search-box {
        padding: 12px;
    }

    .btn {
        padding: 11px 16px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<canvas id="data-stream-bg"></canvas>
<div class="bg-overlay"></div>

<main class="search-container">
    <div class="logo">◢ 𝚠𝚊𝚕𝚔𝚎𝚛 ◣</div>
    <div class="subtitle">SEARCH PROTOCOL v1.6</div>

    <form class="search-form" id="search-form">
        <div class="search-box">
            <input
                type="search"
                id="search-input"
                placeholder="NÃO ESTOU SOZINHO... BUSCAR PROTOCOLO"
                autocomplete="off"
                aria-label="Pesquisar na rede Walker"
            >
        </div>

        <div class="buttons">
            <button class="btn" id="search-btn" type="submit">
                EXECUTAR BUSCA
            </button>
        </div>
    </form>
</main>

<section class="results-container" id="results" aria-live="polite"></section>

<script>
"use strict";

// ========================================
// BANCO DE DADOS LOCAL WALKER
// ========================================

const MY_CUSTOM_SITES = [
    {
        title: "Banco Internacional Walker",
        link: "https://o448786-creator.github.io/BANCO-INTERNACIONAL-WALKER/",
        displayLink: "Banco Walker",
        snippet: "Projeto de banco virtual para a comunidade Walker.",
        keywords: [
            "banco", "money", "saldo", "internacional",
            "carteira", "financeiro", "dinheiro"
        ]
    },
    {
        title: "GTI-WAKER-WORD-BIOGRAFIAS",
        link: "https://o448786-creator.github.io/GTI-WAKER-WORD-BIOGRAFIAS/",
        displayLink: "Biografias Walker",
        snippet: "Biografias dos Walkers.",
        keywords: [
            "gti", "walker", "biografias",
            "waker word", "pessoas"
        ]
    },
    {
        title: "WALKERTUBE",
        link: "https://o448786-creator.github.io/Walkertube/",
        displayLink: "WalkerTube",
        snippet: "Projeto Walker de vídeos.",
        keywords: [
            "walkertube", "video", "vídeo",
            "videos", "vídeos"
        ]
    },
    {
        title: "Walker World",
        link: "https://worldofwalker.com/",
        displayLink: "World of Walker",
        snippet: "Site da comunidade World of Walker.",
        keywords: [
            "walker world", "walkerword",
            "world of walker", "alan walker"
        ]
    },
    {
        title: "Walker Store",
        link: "https://store.alanwalker.com/",
        displayLink: "Walker Store",
        snippet: "Loja oficial de roupas e acessórios de Alan Walker.",
        keywords: [
            "walker store", "store", "roupas",
            "camiseta", "máscara", "mascara"
        ]
    },
    {
        title: "walkERFLIX",
        link: "https://o448786-creator.github.io/WALKERFLIX/",
        displayLink: "WalkerFlix",
        snippet: "Projeto de streaming do universo Walker.",
        keywords: [
            "walkerflix", "streaming",
            "filmes", "séries", "series"
        ]
    },
    {
        title: "Walker Patent Archive Multiverse",
        link: "https://o448786-creator.github.io/WALKER-PATENT-ACHIVE-MULTIVERSE-ULTIMATE/",
        displayLink: "Walker Patent Archive",
        snippet: "Projeto de arquivo do multiverso Walker.",
        keywords: [
            "patent", "patente", "patentes",
            "segredos", "multiverso"
        ]
    }
];

// ========================================
// CONFIGURAÇÃO DA PESQUISA GOOGLE
// ========================================

// A pesquisa local funciona sem API.
// Para pesquisa Google programática, configure
// uma API e um mecanismo de pesquisa.
// Em um site público, use um servidor para proteger a chave.

const API_KEY = "SUA_API_KEY_AQUI";
const SEARCH_ENGINE_ID = "SEU_CX_ID_AQUI";

const searchForm = document.getElementById("search-form");
const searchInput = document.getElementById("search-input");
const searchButton = document.getElementById("search-btn");
const resultsContainer = document.getElementById("results");

function normalizeText(value) {
    return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function isValidHttpUrl(value) {
    try {
        const url = new URL(value);
        return url.protocol === "https:" ||
               url.protocol === "http:";
    } catch {
        return false;
    }
}

function showMessage(message) {
    resultsContainer.replaceChildren();

    const paragraph = document.createElement("p");
    paragraph.className = "status";
    paragraph.textContent = message;

    resultsContainer.appendChild(paragraph);
}

function searchLocal(query) {
    const terms = normalizeText(query)
        .split(/\s+/)
        .filter(Boolean);

    return MY_CUSTOM_SITES.filter(site => {
        const searchable = normalizeText([
            site.title,
            site.displayLink,
            site.snippet,
            ...site.keywords
        ].join(" "));

        return terms.every(term => searchable.includes(term));
    });
}

function createResult(item, isCustom = false) {
    if (!isValidHttpUrl(item.link)) {
        return null;
    }

    const card = document.createElement("article");
    card.className = "result-item";

    if (isCustom) {
        card.classList.add("custom-site");
    }

    const link = document.createElement("a");
    link.href = item.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const display = document.createElement("span");
    display.className = "display-link";
    display.textContent = item.displayLink || item.link;

    const heading = document.createElement("h3");
    heading.textContent = item.title || "Resultado sem título";

    link.append(display, heading);

    const snippet = document.createElement("p");
    snippet.className = "snippet";
    snippet.textContent =
        item.snippet || "Nenhuma descrição disponível.";

    card.append(link, snippet);

    if (isCustom) {
        const label = document.createElement("p");
        label.className = "custom-label";
        label.textContent = "[ WALKER NETWORK ]";
        card.appendChild(label);
    }

    return card;
}

function displayResults(customItems, externalItems = []) {
    resultsContainer.replaceChildren();

    const seenLinks = new Set();
    let total = 0;

    for (const item of customItems) {
        if (!isValidHttpUrl(item.link)) continue;

        const href = new URL(item.link).href;
        if (seenLinks.has(href)) continue;

        seenLinks.add(href);

        const card = createResult(item, true);
        if (card) {
            resultsContainer.appendChild(card);
            total++;
        }
    }

    for (const item of externalItems) {
        if (!item.link || !isValidHttpUrl(item.link)) continue;

        const href = new URL(item.link).href;
        if (seenLinks.has(href)) continue;

        seenLinks.add(href);

        const card = createResult({
            title: item.title,
            link: href,
            displayLink: item.displayLink,
            snippet: item.snippet
        });

        if (card) {
            resultsContainer.appendChild(card);
            total++;
        }
    }

    if (total === 0) {
        showMessage("// Nenhum protocolo correspondente encontrado.");
    }
}

function addGoogleFallback(query, messageText) {
    const message = document.createElement("p");
    message.className = "fallback";
    message.append(
        document.createTextNode(messageText + " ")
    );

    const link = document.createElement("a");
    link.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Pesquisar no Google";

    message.appendChild(link);
    resultsContainer.appendChild(message);
}

async function searchGoogle(query) {
    const endpoint = new URL(
        "https://www.googleapis.com/customsearch/v1"
    );

    endpoint.searchParams.set("key", API_KEY);
    endpoint.searchParams.set("cx", SEARCH_ENGINE_ID);
    endpoint.searchParams.set("q", query);

    const response = await fetch(endpoint.toString());

    if (!response.ok) {
        throw new Error(
            "Google Search API: HTTP " + response.status
        );
    }

    const data = await response.json();

    return Array.isArray(data.items)
        ? data.items.map(item => ({
            title: item.title,
            link: item.link,
            displayLink: item.displayLink,
            snippet: item.snippet
        }))
        : [];
}

let currentSearchId = 0;

async function performSearch() {
    const query = searchInput.value.trim();

    if (!query) {
        showMessage("// Digite algo para pesquisar na rede Walker.");
        searchInput.focus();
        return;
    }

    const searchId = ++currentSearchId;
    const localResults = searchLocal(query);

    const apiConfigured =
        API_KEY !== "SUA_API_KEY_AQUI" &&
        SEARCH_ENGINE_ID !== "SEU_CX_ID_AQUI" &&
        Boolean(API_KEY.trim()) &&
        Boolean(SEARCH_ENGINE_ID.trim());

    searchButton.disabled = true;
    searchButton.textContent = "PESQUISANDO...";

    showMessage("// Inicializando varredura na rede Walker...");

    try {
        if (!apiConfigured) {
            displayResults(localResults);

            if (localResults.length === 0) {
                addGoogleFallback(
                    query,
                    "[AVISO] Nenhum site Walker correspondeu à busca."
                );
            }

            return;
        }

        const externalResults = await searchGoogle(query);

        if (searchId !== currentSearchId) return;

        displayResults(localResults, externalResults);

    } catch (error) {
        console.error("Erro na pesquisa:", error);

        if (searchId !== currentSearchId) return;

        displayResults(localResults);

        addGoogleFallback(
            query,
            "[AVISO] A pesquisa externa falhou."
        );

    } finally {
        if (searchId === currentSearchId) {
            searchButton.disabled = false;
            searchButton.textContent = "EXECUTAR BUSCA";
        }
    }
}

searchForm.addEventListener("submit", event => {
    event.preventDefault();
    performSearch();
});

// ========================================
// FUNDO ANIMADO WALKER
// ========================================

const canvas = document.getElementById("data-stream-bg");
const ctx = canvas.getContext("2d");

const chars = Array.from("0123456789◢◣//XAW___*#@+=-");
const fontSize = 14;

let drops = [];
let animationFrameId = null;
let lastFrameTime = 0;

function resizeCanvas() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(window.innerWidth * ratio);
    canvas.height = Math.floor(window.innerHeight * ratio);

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const columns = Math.ceil(window.innerWidth / fontSize);

    drops = Array.from(
        { length: columns },
        (_, index) => drops[index] || 1
    );
}

function drawDataStream() {
    ctx.fillStyle = "rgba(11, 12, 16, 0.08)";
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.fillStyle = "#00f2fe";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const character =
            chars[Math.floor(Math.random() * chars.length)];

        ctx.fillText(
            character,
            i * fontSize,
            drops[i] * fontSize
        );

        if (
            drops[i] * fontSize > window.innerHeight &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

function animateDataStream(timestamp) {
    if (timestamp - lastFrameTime >= 33) {
        drawDataStream();
        lastFrameTime = timestamp;
    }

    animationFrameId =
        window.requestAnimationFrame(animateDataStream);
}

function startDataStream() {
    if (
        animationFrameId === null &&
        !document.hidden
    ) {
        lastFrameTime = 0;
        animationFrameId =
            window.requestAnimationFrame(animateDataStream);
    }
}

function stopDataStream() {
    if (animationFrameId !== null) {
        window.cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }
}

window.addEventListener("resize", resizeCanvas);

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        stopDataStream();
    } else {
        startDataStream();
    }
});

resizeCanvas();
startDataStream();

// ========================================
// SERVICE WORKER / PWA
// ========================================

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(registration => {
                console.log(
                    "Protocolo PWA ativo:",
                    registration.scope
                );
            })
            .catch(error => {
                console.error(
                    "Falha ao registrar o Service Worker:",
                    error
                );
            });
    });
}
</script>

</body>
</html>
